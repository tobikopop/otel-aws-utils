[package]
name = "otel-aws-utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
opentelemetry = { version = "0.32", default-features = false, features = [
  "trace",
] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "trace",
  "http-proto",
  # The BLOCKING client, deliberately: SdkTracerProvider::builder()
  # .with_batch_exporter() (src/telemetry.rs) drives exports on the SDK's own
  # OS thread, which has no Tokio reactor — an async client panics there the
  # first time a batch is flushed ("there is no reactor running", raised by
  # opentelemetry-http's tokio::time::timeout). opentelemetry_sdk 0.32's
  # BatchSpanProcessor docs say the same: async HTTP clients are not supported
  # by the thread-based processor. hyper-client / reqwest-client must stay off
  # (they take priority over reqwest-blocking-client when both are enabled).
  "reqwest-blocking-client",
] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "trace",
  "rt-tokio",
] }
tracing = { version = "0.1", default-features = false }
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "std",
  "fmt",
  "json",
  "ansi",
  "registry",
  "env-filter",
] }

[lints.rust]
unsafe_code = "forbid"
